<script>
// ---- src\scenes\01-wake.js
/*
 * Shot 1 'wake' : T 0.0 - 2.0, paper.
 * Layers, back to front:
 *   1 paper sheet
 *   2 desk line (pencil)
 *   3 Stackchan (lib.stackchan)
 *   4 servo motion arcs beside the head on each turn
 */
(function () {
  'use strict';
  const ID = 'wake';
  const LIB = FILM.lib;
  const FR = 1 / 24;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  const B_OPEN = 0.5; // T 0.5 eyes open
  const B_LEFT = 1.0; // T 1.0 pan left
  const B_RIGHT = 1.5; // T 1.5 pan right
  const B_HOME = 1.75; // back to centre by T 2.0

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const drawing = (a) => Math.floor((t - a) * 12 + 1e-6);
      const hit = (a, frames, e, lead = 1) => (t < a ? 0 : (e || ((u) => u))(clamp((t - a) / (frames * FR) + lead / frames)));
      const popTwos = (a) => (t < a ? 0 : [0.72, 1.08, 1][Math.min(2, drawing(a))]);

      // 1 paper
      L.paper(ctx, { color: P.sheet, vignette: 0.22, seed: 11, fibres: 0.6 });

      L.camera(ctx, { x: L.SC.cam0[0], y: L.SC.cam0[1], zoom: L.SC.zoom0 }, () => {
        // 2 desk
        L.inkLine(ctx, 150, L.SC.ground, 1130, L.SC.ground, { width: 1.5, color: P.pencil, alpha: 0.8, seed: sd(1), taper: [60, 90] });

        // 3 hero pose on twos
        const pan =
          -1 * hit(B_LEFT, 5, E.snap) * (1 - hit(B_RIGHT, 5, E.snap)) +
          1 * hit(B_RIGHT, 5, E.snap) * (1 - hit(B_HOME, 5, E.inOutCubic));
        const panQ = Math.round(pan * 12) / 12;
        const asleep = t < B_OPEN;
        const breath = Math.sin(tw * Math.PI * 2) * 1.5;
        L.stackchan(ctx, {
          pan: panQ,
          roll: asleep ? 0.06 : 0.06 * (1 - hit(B_OPEN, 4, E.snap)),
          nod: asleep ? 0.5 : 0.5 * (1 - hit(B_OPEN, 4, E.snap)),
          lift: asleep ? breath : 0,
          eyes: asleep ? 'closed' : 'open',
          eyeScale: asleep ? 1 : popTwos(B_OPEN),
          glow: asleep ? 0.25 : 0.25 + 0.75 * hit(B_OPEN, 6),
          seed: 'stackchan',
        });

        // 4 servo motion arcs: three frames after each turn beat
        for (const [b, dir] of [[B_LEFT, -1], [B_RIGHT, 1], [B_HOME, 0]]) {
          const d = drawing(b);
          if (t < b || d > 2) continue;
          const side = dir === 0 ? -Math.sign(pan || 1) : dir;
          const x = 640 + side * 160;
          for (let i = 0; i < 3; i++) {
            const r = 34 + i * 16;
            const a0 = side > 0 ? -0.55 : Math.PI - 0.55;
            const pts = [];
            for (let k = 0; k <= 10; k++) {
              const a = a0 + (k / 10) * 1.1;
              pts.push([x - side * 30 + Math.cos(a) * r, 380 + Math.sin(a) * r]);
            }
            L.inkPath(ctx, pts, { width: 2.2 - i * 0.4, alpha: 0.8 - d * 0.25, seed: sd(b, i, d) });
          }
        }
      });
    },
  });
})();

</script>
<script>
// ---- src\scenes\02-smile.js
/*
 * Shot 2 'smile' : T 2.0 - 3.0, paper.
 * Layers, back to front:
 *   1 paper sheet
 *   2 world under the dive camera: desk, Stackchan, pencil construction circles and radial strokes on the right eye
 *   3 screen-fixed speed lines during the dive
 * Last frame = contract G1: eye disc centred (640, 360), r 260 (lib.eyeCam(1)).
 */
(function () {
  'use strict';
  const ID = 'smile';
  const LIB = FILM.lib;
  const FR = 1 / 24;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  const B_HAPPY = 0.0; // T 2.0 happy hop
  const B_GUIDE = 0.5; // T 2.5 guides + riser
  const DIVE0 = 0.54;
  const DIVE1 = 23 / 24; // last frame lands on G1

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const r = LIB.rng(sd('rays'));
    const rays = [];
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * TAU + r.range(-0.05, 0.05);
      rays.push({ a, r0: r.range(24, 34), r1: r.range(46, 78), w: r.range(0.8, 1.6), d: r.range(0, 0.12) });
    }
    const speed = [];
    for (let i = 0; i < 46; i++) speed.push({ a: r.range(0, TAU), r0: r.range(290, 420), len: r.range(80, 260), w: r.range(0.8, 2) });
    GEO = { rays, speed };
    return GEO;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const drawing = (a) => Math.floor((t - a) * 12 + 1e-6);
      const hit = (a, frames, e, lead = 1) => (t < a ? 0 : (e || ((u) => u))(clamp((t - a) / (frames * FR) + lead / frames)));
      const popTwos = (a) => (t < a ? 0 : [0.72, 1.08, 1][Math.min(2, drawing(a))]);
      const G = geo();

      L.paper(ctx, { color: P.sheet, vignette: 0.22, seed: 11, fibres: 0.6 });

      const k = E.inOutQuart(clamp((t - DIVE0) / (DIVE1 - DIVE0)));
      const cam = L.eyeCam(k);
      const [ex, ey] = L.SC.eyeR;

      L.camera(ctx, cam, () => {
        L.inkLine(ctx, 150, L.SC.ground, 1130, L.SC.ground, { width: 1.5, color: P.pencil, alpha: 0.8, seed: LIB.hash('wake', 1) & 0x7fffffff, taper: [60, 90] });

        // happy hop on twos: up over 5 drawings, down with a small squash
        const hopU = clamp(tw / 0.42);
        const hop = Math.sin(hopU * Math.PI) * 18;
        const happy = t < B_GUIDE;
        L.stackchan(ctx, {
          hop,
          lift: Math.sin(hopU * Math.PI) * 4,
          nod: -0.35 * Math.sin(hopU * Math.PI),
          eyes: happy ? 'happy' : 'open',
          eyeScale: happy ? popTwos(B_HAPPY) : popTwos(B_GUIDE),
          mouth: happy ? 1 - hit(0.25, 5, E.outCubic) : 0,
          glow: 1,
          seed: 'stackchan',
        });

        // pencil construction circles on the eye (drawn on over 5 drawings, boiling)
        const g = hit(B_GUIDE, 8, E.outCubic);
        if (g > 0) {
          const radii = [16, 24, 36, 52];
          radii.forEach((R, i) => {
            L.guideCircle(ctx, ex, ey, R, { p: clamp(g * 1.4 - i * 0.12), color: P.pencil, alpha: 0.75, width: 1.1 / Math.sqrt(cam.zoom) + 0.25, ink: true, seed: sd('c', i) });
          });
          for (const ray of G.rays) {
            const q = clamp((g - ray.d) / 0.8);
            if (q <= 0) continue;
            const a = ray.a;
            L.inkLine(ctx, ex + Math.cos(a) * ray.r0, ey + Math.sin(a) * ray.r0, ex + Math.cos(a) * (ray.r0 + (ray.r1 - ray.r0) * q), ey + Math.sin(a) * (ray.r0 + (ray.r1 - ray.r0) * q), {
              width: ray.w * 0.8, color: P.pencil, alpha: 0.7, seed: sd('r', a), taper: [2, 8],
            });
          }
        }
      });

      // 3 screen-fixed speed lines while the dive is fastest
      const sp = clamp((t - 0.7) / 0.2) * (1 - clamp((t - 0.93) / 0.04));
      if (sp > 0) {
        const bi = L.boil(info.T);
        for (let i = 0; i < G.speed.length; i++) {
          const s = G.speed[i];
          if (L.h3(i, bi, 7) > 0.7) continue;
          const r0 = s.r0 + (1 - sp) * 60;
          L.inkLine(ctx, 640 + Math.cos(s.a) * r0, 360 + Math.sin(s.a) * r0, 640 + Math.cos(s.a) * (r0 + s.len), 360 + Math.sin(s.a) * (r0 + s.len), {
            width: s.w, color: P.lilac, alpha: 0.55 * sp, seed: sd('s', i, bi), taper: [4, 30],
          });
        }
      }
    },
  });
})();

</script>
<script>
// ---- src\scenes\03-pixels.js
/*
 * Shot 3 'pixels' : T 3.0 - 4.0, cosmos. The drop.
 * Layers, back to front:
 *   1 cosmos plate, dimmed to the screen black on frame 0 so G1 reads as the same eye
 *   2 pixel glows (additive)
 *   3 pixel squares
 *   4 glock twinkle on T 3.5
 * Frame 0 = G1 (eye pill of 20 px pixels, centre (640, 360), 260 x 520, lib.EYE_PX).
 * Last frame = G2 (8 rays from (640, 360), angles k*45deg, r 70 -> 560).
 */
(function () {
  'use strict';
  const ID = 'pixels';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;
  const CX = 640, CY = 360, CELL = 20;
  const RAY0 = 70, RAY1 = 560;
  const B_GLOCK = 0.5; // T 3.5

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const P = LIB.pal;
    const cols = [P.cyan, P.lilac, P.cyan, P.pink, P.hot, P.violet];
    const px = [];
    // inside test for the eye pill (lib.pill corner = 0.375 of the short side)
    const [PW, PH] = LIB.EYE_PX;
    const pr = Math.min(PW, PH) * 0.375;
    const inPill = (x, y) => {
      const qx = Math.max(0, Math.abs(x) - (PW / 2 - pr)), qy = Math.max(0, Math.abs(y) - (PH / 2 - pr));
      return Math.hypot(qx, qy) <= pr - 3;
    };
    for (let gy = -PH / 2; gy < PH / 2; gy += CELL) {
      for (let gx = -PW / 2; gx < PW / 2; gx += CELL) {
        const x = gx + CELL / 2, y = gy + CELL / 2;
        if (!inPill(x, y)) continue;
        const r = LIB.rng(sd(gx, gy));
        const a = Math.atan2(y, x);
        const ray = ((Math.round(a / (TAU / 8)) % 8) + 8) % 8;
        px.push({ hx: CX + x, hy: CY + y, a, d: Math.hypot(x, y), ray, burst: r.range(0.5, 1.4), spin: r.range(0.6, 1.3), col: r.pick(cols), tw: r() < 0.12, jit: r.range(-1, 1) });
      }
    }
    // rank pixels along their ray by home distance, then spread them over r 70..560
    for (let k = 0; k < 8; k++) {
      const list = px.filter((p) => p.ray === k).sort((a, b) => a.d - b.d);
      list.forEach((p, i) => {
        const rr = lerp(RAY0, RAY1, list.length > 1 ? i / (list.length - 1) : 0);
        const ang = k * (TAU / 8);
        p.tx = CX + Math.cos(ang) * rr + Math.sin(ang) * p.jit * 7;
        p.ty = CY + Math.sin(ang) * rr - Math.cos(ang) * p.jit * 7;
      });
    }
    GEO = { px };
    return GEO;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const G = geo();

      // 1 plate
      L.cosmos(ctx, { seed: 21, drift: info.T * 30, dim: 1 - E.outCubic(clamp(t / 0.35)) });

      const u1 = E.outCubic(clamp(tw / 0.5));
      const u2 = E.inOutCubic(clamp((tw - 0.42) / (0.96 - 0.42)));
      const glock = t >= B_GLOCK ? Math.max(0, 1 - (t - B_GLOCK) / 0.3) : 0;
      const pos = new Float64Array(G.px.length * 2);
      const sizes = new Float64Array(G.px.length);

      for (let i = 0; i < G.px.length; i++) {
        const p = G.px[i];
        // burst + swirl around the centre
        const sw = 1.1 * u1 * p.spin;
        const dist = p.d * (1 + 1.1 * u1 * p.burst) + 30 * u1;
        const a = p.a + sw;
        const bx = CX + Math.cos(a) * dist, by = CY + Math.sin(a) * dist;
        pos[i * 2] = lerp(bx, p.tx, u2);
        pos[i * 2 + 1] = lerp(by, p.ty, u2);
        sizes[i] = lerp(lerp(CELL - 2, 11, u1), 8, u2);
      }

      // 2 glows
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < G.px.length; i++) {
        const p = G.px[i];
        const s = sizes[i] * 2.4;
        ctx.globalAlpha = 0.13 * u1;
        ctx.fillStyle = p.col;
        ctx.fillRect(pos[i * 2] - s / 2, pos[i * 2 + 1] - s / 2, s, s);
      }
      ctx.restore();

      // 3 pixels: white eye pixels take on their colour as they burst
      for (let i = 0; i < G.px.length; i++) {
        const p = G.px[i];
        const s = sizes[i];
        ctx.fillStyle = L.mix(P.face, p.col, clamp(u1 * 1.3));
        ctx.fillRect(pos[i * 2] - s / 2, pos[i * 2 + 1] - s / 2, s, s);
      }

      // 4 glock twinkle: a handful of pixels flare on the beat
      if (glock > 0) {
        for (let i = 0; i < G.px.length; i++) {
          const p = G.px[i];
          if (!p.tw) continue;
          L.glowDot(ctx, pos[i * 2], pos[i * 2 + 1], 5, { color: p.col, intensity: glock, rays: 4, rayLen: 3, seed: sd('g', i) });
        }
      }
      // the centre spark builds as the rays form
      if (u2 > 0) L.glowDot(ctx, CX, CY, 10 + 8 * u2, { color: P.cyan, intensity: u2, rays: 8, rayLen: 3.2, seed: sd('core') });
    },
  });
})();

</script>
<script>
// ---- src\scenes\04-circuit.js
/*
 * Shot 4 'circuit' : T 4.0 - 5.0, cosmos.
 * Layers, back to front:
 *   1 cosmos plate
 *   2 PCB traces (glow pass, then line pass) with pads and side branches
 *   3 chip at the centre with pins
 *   4 pulses running out along the traces on the 8ths
 * Frame 0 = G2 (8 rays, dotted, from r 70 to 560). The rays fold into 45deg-routed traces.
 * Last frame = G3 input: the chip 100x100 and the 8 routed traces (neuron.js rebuilds them with the
 * same TRACE() function, copied verbatim).
 */
(function () {
  'use strict';
  const ID = 'circuit';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;
  const CX = 640, CY = 360;

  // ---- canonical trace geometry (copied verbatim into 05-neuron.js) ----
  // Ray k leaves the chip at r 70, runs to r 190, jogs 45deg for 110 px, then runs parallel to r 560+.
  function TRACE(k, bend) {
    const a = k * (TAU / 8);
    const side = k % 2 ? -1 : 1;
    const ca = Math.cos(a), sa = Math.sin(a);
    const nx = -sa * side, ny = ca * side;
    const P = (r, off) => [CX + ca * r + nx * off, CY + sa * r + ny * off];
    const j = 78 * bend;
    return [P(70, 0), P(190, 0), P(190 + 78, j), P(620, j)];
  }
  function SIDES(k) {
    // two short side branches per trace: [fraction along the last leg, turn side, length]
    const r = LIB.rng(LIB.hash('pcb-sides', k));
    return [
      { f: r.range(0.2, 0.35), s: r.sign(), len: r.range(50, 90) },
      { f: r.range(0.55, 0.75), s: r.sign(), len: r.range(40, 80) },
    ];
  }
  // -----------------------------------------------------------------------

  function along(pts, u) {
    let total = 0;
    const seg = [];
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      seg.push(d);
      total += d;
    }
    let s = u * total;
    for (let i = 0; i < seg.length; i++) {
      if (s <= seg[i] || i === seg.length - 1) {
        const f = seg[i] ? clamp(s / seg[i]) : 0;
        return [lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f)];
      }
      s -= seg[i];
    }
    return pts[pts.length - 1];
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);

      L.cosmos(ctx, { seed: 21, drift: info.T * 30 });

      const bend = E.snap(clamp(tw / 0.33));
      const solid = E.outCubic(clamp(tw / 0.25)); // dotted pixels fuse into a line
      const cols = [P.cyan, P.violet, P.lilac, P.violet, P.cyan, P.violet, P.lilac, P.violet];

      // 2 traces
      for (let pass = 0; pass < 2; pass++) {
        for (let k = 0; k < 8; k++) {
          const pts = TRACE(k, bend);
          const col = cols[k];
          if (pass === 0) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = L.rgba(col, 0.16);
            ctx.lineWidth = 22;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            L.tracePath(ctx, pts, false);
            ctx.stroke();
            ctx.restore();
            continue;
          }
          if (solid < 1) {
            // the pixel dots of G2 fade as the copper line fuses under them
            ctx.fillStyle = col;
            ctx.globalAlpha = 1 - solid;
            for (let i = 0; i <= 27; i++) {
              const q = along(pts, i / 27 * (490 / 550));
              ctx.fillRect(q[0] - 4, q[1] - 4, 8, 8);
            }
            ctx.globalAlpha = 1;
          }
          if (solid > 0) L.inkPath(ctx, pts, { width: 6, color: col, alpha: solid, smooth: false, seed: sd('t', k), taper: [4, 0], wobble: 0.6, tremble: 0.2 });
          // side branches with pads
          const sides = SIDES(k);
          for (const s of sides) {
            const g = E.outCubic(clamp((tw - 0.2 - s.f * 0.2) / 0.3));
            if (g <= 0) continue;
            const a = k * (TAU / 8) + s.s * (TAU / 8);
            const p0 = along([pts[2], pts[3]], s.f);
            const p1 = [p0[0] + Math.cos(a) * s.len * g, p0[1] + Math.sin(a) * s.len * g];
            L.inkPath(ctx, [p0, p1], { width: 3.6, color: col, smooth: false, seed: sd('s', k, s.f), taper: [2, 0] });
            if (g > 0.95) {
              L.inkCircle(ctx, p1[0], p1[1], 7, { width: 2.2, color: P.gold, seed: sd('pad', k, s.f) });
              ctx.fillStyle = P.void;
              ctx.beginPath();
              ctx.arc(p1[0], p1[1], 3, 0, TAU);
              ctx.fill();
            }
          }
          // via pad at the jog
          if (bend > 0.9) L.inkCircle(ctx, pts[2][0], pts[2][1], 6, { width: 2, color: P.gold, seed: sd('via', k) });
        }
      }

      // 3 chip (pops in on frame 0 from the centre spark)
      const cp = t < 1e-6 ? 0.72 : E.outBack(clamp(tw / 0.17));
      const hs = 50 * cp;
      if (hs > 1) {
        ctx.fillStyle = '#16122E';
        ctx.fillRect(CX - hs, CY - hs, hs * 2, hs * 2);
        L.inkPath(ctx, L.rectPts(CX - hs, CY - hs, hs * 2, hs * 2, 10), { closed: true, width: 3, color: P.lilac, smooth: false, seed: sd('chip') });
        // pins: 5 per side
        for (let side = 0; side < 4; side++) {
          const a = side * (TAU / 4);
          const ca = Math.cos(a), sa = Math.sin(a);
          for (let i = 0; i < 5; i++) {
            const o = (i - 2) * 16 * cp;
            const x0 = CX + ca * hs - sa * o, y0 = CY + sa * hs + ca * o;
            L.inkLine(ctx, x0, y0, x0 + ca * 11 * cp, y0 + sa * 11 * cp, { width: 2.4, color: P.lilac, seed: sd('pin', side, i), taper: 0 });
          }
        }
        // die mark
        L.inkCircle(ctx, CX - hs * 0.55, CY - hs * 0.55, 4 * cp, { width: 1.6, color: P.lilac, seed: sd('dot') });
        L.glowDot(ctx, CX, CY, 9, { color: P.cyan, intensity: 0.6 + 0.4 * Math.sin(tw * TAU * 4), rays: 4, seed: sd('core') });
      }

      // 4 pulses: a volley on every 8th (0.25 s), each takes 0.5 s to reach r 620
      for (let v = 0; v < 4; v++) {
        const t0 = v * 0.25;
        const u = (t - t0) / 0.5;
        if (u < 0 || u > 1) continue;
        for (let k = 0; k < 8; k++) {
          if ((k + v) % 2) continue;
          const p = along(TRACE(k, bend), E.inQuad(u));
          L.glowDot(ctx, p[0], p[1], 7, { color: k % 2 ? P.lilac : P.cyan, rays: 4, rayLen: 2.8, intensity: 1 - u * 0.4, seed: sd('p', v, k) });
        }
      }
    },
  });
})();

</script>
<script>
// ---- src\scenes\05-neuron.js
/*
 * Shot 5 'neuron' : T 5.0 - 6.0, cosmos.
 * Layers, back to front:
 *   1 cosmos plate
 *   2 distant mini neurons (flash on T 5.5)
 *   3 dendrite glow pass, then dendrites (8 mains morphing from the PCB traces, children, grandchildren)
 *   4 soma: the chip square rounding into a cell body, nucleus glow
 *   5 impulse: sparks run from the tips into the soma on T 5.5
 * Frame 0 = G3: circuit's last frame (chip 100x100, 8 TRACE(k, 1) lines), so the cut is invisible.
 */
(function () {
  'use strict';
  const ID = 'neuron';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;
  const CX = 640, CY = 360;
  const B_IMPULSE = 0.5; // T 5.5

  // ---- canonical trace geometry (verbatim from 04-circuit.js) ----
  function TRACE(k, bend) {
    const a = k * (TAU / 8);
    const side = k % 2 ? -1 : 1;
    const ca = Math.cos(a), sa = Math.sin(a);
    const nx = -sa * side, ny = ca * side;
    const P = (r, off) => [CX + ca * r + nx * off, CY + sa * r + ny * off];
    const j = 78 * bend;
    return [P(70, 0), P(190, 0), P(190 + 78, j), P(620, j)];
  }
  function SIDES(k) {
    // two short side branches per trace: [fraction along the last leg, turn side, length]
    const r = LIB.rng(LIB.hash('pcb-sides', k));
    return [
      { f: r.range(0.2, 0.35), s: r.sign(), len: r.range(50, 90) },
      { f: r.range(0.55, 0.75), s: r.sign(), len: r.range(40, 80) },
    ];
  }
  // -----------------------------------------------------------------

  function along(pts, u) {
    let total = 0;
    const seg = [];
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      seg.push(d);
      total += d;
    }
    let s = u * total;
    for (let i = 0; i < seg.length; i++) {
      if (s <= seg[i] || i === seg.length - 1) {
        const f = seg[i] ? clamp(s / seg[i]) : 0;
        return [lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f)];
      }
      s -= seg[i];
    }
    return pts[pts.length - 1];
  }
  const N = 16; // resample count for the morph

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const mains = [];
    for (let k = 0; k < 8; k++) {
      const tr = TRACE(k, 1);
      const from = [], to = [];
      const r = LIB.rng(sd('m', k));
      const ph = r.range(0, TAU), fq = r.range(1.4, 2.4), amp = r.range(26, 44);
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        from.push(along(tr, u));
        // the dendrite: radial from the soma edge, with a slow meander that grows with distance
        const a = k * (TAU / 8) + Math.sin(ph + u * fq * 3) * 0.05;
        const rr = lerp(50, 600, u);
        const off = Math.sin(ph + u * fq * TAU) * amp * u;
        to.push([CX + Math.cos(a) * rr - Math.sin(a) * off, CY + Math.sin(a) * rr + Math.cos(a) * off]);
      }
      const kids = [];
      for (const f of [0.28, 0.5, 0.72]) {
        const s = r.sign();
        const base = to[Math.round(f * (N - 1))];
        const a0 = k * (TAU / 8) + s * r.range(0.45, 0.8);
        const len = r.range(70, 140) * (1 - f * 0.3);
        const mid = [base[0] + Math.cos(a0) * len * 0.5 + r.range(-10, 10), base[1] + Math.sin(a0) * len * 0.5 + r.range(-10, 10)];
        const tip = [base[0] + Math.cos(a0 + s * 0.2) * len, base[1] + Math.sin(a0 + s * 0.2) * len];
        const grand = [];
        for (let g = 0; g < 2; g++) {
          const b = [lerp(mid[0], tip[0], 0.3 + g * 0.4), lerp(mid[1], tip[1], 0.3 + g * 0.4)];
          const ga = a0 + (g ? -s : s) * r.range(0.5, 0.9);
          const gl = r.range(28, 58);
          grand.push([b, [b[0] + Math.cos(ga) * gl, b[1] + Math.sin(ga) * gl]]);
        }
        kids.push({ f, pts: [base, mid, tip], grand });
      }
      mains.push({ from, to, kids });
    }
    const minis = [[150, 120], [1150, 140], [118, 600], [1170, 590], [360, 668], [930, 64]].map(([x, y], i) => {
      const r = LIB.rng(sd('mini', i));
      const arms = [];
      const n = r.int(5, 7);
      for (let j = 0; j < n; j++) {
        const a = (j / n) * TAU + r.range(-0.3, 0.3);
        arms.push([a, r.range(18, 40)]);
      }
      return { x, y, arms, d: i * 0.045 };
    });
    GEO = { mains, minis };
    return GEO;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const G = geo();

      L.cosmos(ctx, { seed: 21, drift: info.T * 30 });

      const m = E.inOutCubic(clamp(tw / 0.42)); // trace -> dendrite
      const grow = E.outCubic(clamp((tw - 0.12) / 0.4));
      const imp = t >= B_IMPULSE ? clamp((t - B_IMPULSE) / 0.34) : 0;

      // 2 mini neurons
      for (const n of G.minis) {
        const a = m * 0.7;
        if (a <= 0.02) continue;
        const flash = t >= B_IMPULSE + n.d ? Math.max(0, 1 - (t - B_IMPULSE - n.d) / 0.25) : 0;
        for (const [ang, len] of n.arms) {
          L.inkLine(ctx, n.x, n.y, n.x + Math.cos(ang) * len * m, n.y + Math.sin(ang) * len * m, { width: 2, color: P.violet, alpha: a, seed: sd('ma', n.x, ang), taper: [1, 12] });
        }
        L.glowDot(ctx, n.x, n.y, 4 + 3 * flash, { color: flash > 0 ? P.hot : P.lilac, intensity: 0.4 * a + flash, rays: flash > 0 ? 6 : 0, seed: sd('mg', n.x) });
      }

      // 3 dendrites: morph the resampled trace into the dendrite, then grow the children
      const mainPts = G.mains.map((d) => d.from.map((p, i) => [lerp(p[0], d.to[i][0], m), lerp(p[1], d.to[i][1], m)]));
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = L.rgba(P.violet, 0.2);
      ctx.lineWidth = lerp(22, 30, m);
      for (const pts of mainPts) {
        ctx.beginPath();
        L.tracePath(ctx, pts, false);
        ctx.stroke();
      }
      ctx.restore();
      const cols = [P.cyan, P.violet, P.lilac, P.violet, P.cyan, P.violet, P.lilac, P.violet];
      mainPts.forEach((pts, k) => {
        const col = L.mix(cols[k], P.lilac, m);
        L.inkPath(ctx, pts, { width: lerp(6, 9, m), color: col, smooth: m > 0.05, seed: sd('d', k), taper: [2, lerp(0, 380, m)], wobble: lerp(0.6, 1.6, m), minWidth: 0.2 });
        if (grow <= 0) return;
        for (const kid of G.mains[k].kids) {
          const g = clamp((grow - kid.f * 0.3) / 0.7);
          if (g <= 0) continue;
          const [b, mid, tip] = kid.pts;
          const sub = [b, [lerp(b[0], mid[0], clamp(g * 2)), lerp(b[1], mid[1], clamp(g * 2))]];
          if (g > 0.5) sub.push([lerp(mid[0], tip[0], (g - 0.5) * 2), lerp(mid[1], tip[1], (g - 0.5) * 2)]);
          L.inkPath(ctx, sub, { width: 4.4, color: P.lilac, seed: sd('k', k, kid.f), taper: [1, 60], minWidth: 0.2 });
          if (g > 0.7) {
            const gg = (g - 0.7) / 0.3;
            for (const [p0, p1] of kid.grand) {
              L.inkPath(ctx, [p0, [lerp(p0[0], p1[0], gg), lerp(p0[1], p1[1], gg)]], { width: 2.6, color: P.lilac, alpha: 0.85, seed: sd('g', k, p0[0]), taper: [1, 30], minWidth: 0.2 });
            }
          }
        }
      });

      // circuit leftovers (side branches, pads, vias, pins) fade out over the first 5 drawings
      const left = 1 - clamp(tw / 0.42);
      if (left > 0) {
        for (let k = 0; k < 8; k++) {
          const tr = TRACE(k, 1);
          const col = cols[k];
          for (const s of SIDES(k)) {
            const a = k * (TAU / 8) + s.s * (TAU / 8);
            const p0 = along([tr[2], tr[3]], s.f);
            const p1 = [p0[0] + Math.cos(a) * s.len, p0[1] + Math.sin(a) * s.len];
            L.inkPath(ctx, [p0, p1], { width: 3.6, color: col, alpha: left, smooth: false, seed: LIB.hash('circuit', 's', k, s.f) & 0x7fffffff, taper: [2, 0] });
            L.inkCircle(ctx, p1[0], p1[1], 7, { width: 2.2, color: P.gold, alpha: left, seed: LIB.hash('circuit', 'pad', k, s.f) & 0x7fffffff });
          }
          L.inkCircle(ctx, tr[2][0], tr[2][1], 6, { width: 2, color: P.gold, alpha: left, seed: LIB.hash('circuit', 'via', k) & 0x7fffffff });
        }
        for (let side = 0; side < 4; side++) {
          const a = side * (TAU / 4);
          const ca = Math.cos(a), sa = Math.sin(a);
          for (let i = 0; i < 5; i++) {
            const o = (i - 2) * 16;
            const x0 = CX + ca * 50 - sa * o, y0 = CY + sa * 50 + ca * o;
            L.inkLine(ctx, x0, y0, x0 + ca * 11, y0 + sa * 11, { width: 2.4, color: P.lilac, alpha: left, seed: LIB.hash('circuit', 'pin', side, i) & 0x7fffffff, taper: 0 });
          }
        }
      }

      // 4 soma: the chip square rounds into a cell body
      const r = lerp(6, 52, m);
      const half = lerp(50, 54, m);
      ctx.beginPath();
      L.pill(ctx, CX, CY, half * 2, half * 2 * lerp(1, 0.94, m));
      ctx.fillStyle = L.mix('#16122E', '#2A1F5C', m);
      ctx.fill();
      const soma = L.rrectPts(CX - half, CY - half * lerp(1, 0.94, m), half * 2, half * 2 * lerp(1, 0.94, m), r, 8);
      L.inkPath(ctx, soma, { closed: true, width: lerp(3, 5, m), color: P.lilac, seed: sd('soma'), smooth: m > 0.3 });
      L.hatch(ctx, soma, { angle: -0.8, spacing: 7, width: 1.1, color: P.violet, alpha: 0.5 * m, seed: sd('sh') });
      const charge = imp >= 1 ? 1 : 0;
      const pulse = 0.6 + 0.4 * Math.sin(tw * TAU * 4);
      L.glowDot(ctx, CX, CY, lerp(9, 14, m) + 8 * charge * clamp((t - 0.84) / 0.12), { color: charge ? P.hot : P.cyan, intensity: pulse + charge, rays: m > 0.5 ? 6 : 4, rayLen: 3, seed: sd('nuc') });

      // 5 impulse: sparks run inward along the mains, arriving at the soma by T 5.84
      if (imp > 0 && imp < 1) {
        for (let k = 0; k < 8; k++) {
          const p = along(mainPts[k], 1 - E.inQuad(imp));
          L.glowDot(ctx, p[0], p[1], 7, { color: P.hot, rays: 6, rayLen: 3.2, intensity: 1, seed: sd('i', k) });
        }
      }
    },
  });
})();

</script>
<script>
// ---- src\scenes\06-voice.js
/*
 * Shot 6 'voice' : T 6.0 - 7.0, cosmos. Enters on a warm flash (the soma fires).
 * Layers, back to front:
 *   1 cosmos plate
 *   2 speech waveform across the frame (Stackchan talking), fading as the rings settle
 *   3 echo rings expanding off-frame on every 8th
 *   4 four voice rings: wobbling with the syllables, settling into clean circles (G5)
 *   5 soma flare at the centre, cooling
 * Frame 0: soma r 50 at the centre (G4). Last frame = G5: rings r 60/120/180/240 at (640, 360).
 */
(function () {
  'use strict';
  const ID = 'voice';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;
  const CX = 640, CY = 360;
  const RINGS = [60, 120, 180, 240];

  // syllable envelope: a beep on every 8th, shaped like speech
  const SYL = [1, 0.7, 0.9, 0.55];
  function speech(t) {
    const i = Math.floor(t / 0.125);
    const f = t / 0.125 - i;
    const amp = SYL[i % 4] || 0;
    return amp * Math.sin(Math.PI * Math.min(1, f * 1.4));
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const settle = E.inOutCubic(clamp((tw - 0.55) / 0.4));
      const talk = speech(tw) * (1 - settle);
      const cols = [P.pink, P.cyan, P.lilac, P.gold];

      L.cosmos(ctx, { seed: 21, drift: info.T * 30 });

      // 2 waveform
      const wa = (1 - settle) * clamp(tw / 0.12);
      if (wa > 0.01) {
        const pts = [];
        for (let x = -10; x <= 1290; x += 10) {
          const d = Math.abs(x - CX) / 640;
          const env = Math.exp(-d * d * 3) * (0.35 + talk);
          const y = CY + env * (Math.sin(x * 0.045 + tw * 20) * 70 + Math.sin(x * 0.11 - tw * 31) * 28);
          pts.push([x, y]);
        }
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        L.inkPath(ctx, pts, { width: 3.2, color: P.pink, alpha: 0.55 * wa, seed: sd('w', L.boil(info.T)), taper: [60, 60] });
        ctx.restore();
      }

      // 3 echo rings
      for (let v = 0; v < 8; v++) {
        const t0 = v * 0.125;
        const u = (t - t0) / 0.6;
        if (u < 0 || u > 1) continue;
        const R = lerp(50, 820, E.outQuad(u));
        L.guideCircle(ctx, CX, CY, R, { color: v % 2 ? P.cyan : P.pink, alpha: 0.35 * (1 - u) * (1 - settle * 0.7), width: 2 });
      }

      // 4 voice rings
      for (let i = 0; i < 4; i++) {
        const ti = i * 0.125;
        if (t < ti) continue;
        const grow = E.outBack(clamp((tw - ti) / 0.3));
        const R = lerp(50, RINGS[i], grow);
        const n = 6 + 2 * i;
        const A = (6 + 16 * talk) * (1 - settle) * (1 + i * 0.2);
        const pts = [];
        const M = 96 + i * 24;
        for (let j = 0; j < M; j++) {
          const th = (j / M) * TAU;
          const r = R + A * Math.sin(n * th + tw * (9 + i * 3) + i);
          pts.push([CX + Math.cos(th) * r, CY + Math.sin(th) * r]);
        }
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = L.rgba(cols[i], 0.2);
        ctx.lineWidth = 16;
        ctx.beginPath();
        L.tracePath(ctx, pts, true);
        ctx.stroke();
        ctx.restore();
        L.inkPath(ctx, pts, { closed: true, width: 5, color: cols[i], seed: sd('r', i), wobble: 0.8 });
      }

      // 5 soma flare, cooling into the hub glow
      const flare = 1 - E.outCubic(clamp(t / 0.4));
      L.glowDot(ctx, CX, CY, lerp(14, 48, flare), { color: P.hot, intensity: 0.6 + flare, rays: 8, rayLen: lerp(2.5, 4, flare), seed: sd('core') });
    },
  });
})();

</script>
<script>
// ---- src\scenes\07-servo.js
/*
 * Shot 7 'servo' : T 7.0 - 8.0, cosmos.
 * Layers, back to front (all under one camera centred on (640, 360)):
 *   1 cosmos plate
 *   2 two side gears sliding in to mesh
 *   3 main gear: the four voice rings become rim, web holes and hub; 24 teeth grow on the outer ring
 *   4 servo horn: a white single-arm horn on the hub (lib.pill), turning with the gear
 *   5 dim to the screen black as the camera dives into the horn
 * Frame 0 = G5 (rings r 60/120/180/240). Last frame = G6: the horn is a vertical white pill
 * 260 x 520 at (640, 360) on screen black, the same shape as the eye (lib.EYE_PX).
 */
(function () {
  'use strict';
  const ID = 'servo';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;
  const CX = 640, CY = 360;
  const HORN_W = 16, HORN_H = 32; // world px; x ZOOM_END = EYE_PX
  const ZOOM_END = LIB.EYE_PX[1] / HORN_H;
  const B_SWELL = 0.5; // T 7.5 the dive starts

  function gearPts(R, teeth, th, rot, n = 12) {
    const pts = [];
    for (let i = 0; i < teeth; i++) {
      const a0 = rot + (i / teeth) * TAU;
      const step = TAU / teeth;
      for (let j = 0; j < n; j++) {
        const f = j / n;
        // trapezoid tooth profile: root 0-0.25, rise 0.25-0.4, top 0.4-0.6, fall 0.6-0.75, root
        const h = f < 0.25 ? 0 : f < 0.4 ? (f - 0.25) / 0.15 : f < 0.6 ? 1 : f < 0.75 ? 1 - (f - 0.6) / 0.15 : 0;
        const r = R + th * h;
        const a = a0 + f * step;
        pts.push([CX + Math.cos(a) * r, CY + Math.sin(a) * r]);
      }
    }
    return pts;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const teeth = E.snap(clamp(tw / 0.3));
      const solid = E.outCubic(clamp((tw - 0.05) / 0.3));
      // one full turn over the shot, ending with the horn vertical
      const rot = TAU * E.inOutQuad(clamp(tw / (23 / 24)));
      const k = E.inOutCubic(clamp((t - B_SWELL) / (23 / 24 - B_SWELL)));
      const zoom = Math.exp(Math.log(ZOOM_END) * k);
      const dim = E.inQuad(clamp((t - 0.72) / 0.22));
      const ringCols = [P.pink, P.cyan, P.lilac, P.gold];

      L.cosmos(ctx, { seed: 21, drift: info.T * 30 });

      L.camera(ctx, { x: CX, y: CY, zoom }, () => {
        // 2 side gears
        const slide = E.outCubic(clamp((tw - 0.08) / 0.35));
        if (slide > 0) {
          for (const g of [{ R: 96, n: 10, ang: -0.42, sp: -2.4 }, { R: 70, n: 8, ang: 2.55, sp: -3.2 }]) {
            const dist = 240 + g.R + 14;
            const gx = Math.cos(g.ang) * (dist + (1 - slide) * 260), gy = Math.sin(g.ang) * (dist + (1 - slide) * 260);
            ctx.save();
            ctx.translate(gx, gy);
            const pts = gearPts(g.R, g.n, 22, rot * g.sp + g.ang, 10);
            L.inkPath(ctx, pts, { closed: true, width: 3.4, color: P.lilac, fill: '#241A48', smooth: false, seed: sd('sg', g.R), alpha: slide });
            L.inkCircle(ctx, CX, CY, g.R * 0.3, { width: 3, color: P.lilac, seed: sd('sh', g.R), alpha: slide });
            ctx.restore();
          }
        }

        // 3 main gear body (fills in as the rings fuse)
        const body = gearPts(240, 24, 26 * teeth, rot, 12);
        if (solid > 0) {
          ctx.save();
          ctx.globalAlpha = solid;
          ctx.fillStyle = '#3A2C12';
          ctx.beginPath();
          L.tracePath(ctx, body, true);
          ctx.fill();
          L.hatch(ctx, body, { angle: -0.7, spacing: 8, width: 1.2, color: P.gold, alpha: 0.35 * solid, seed: sd('h') });
          // web holes between the 120 and 180 rings
          ctx.fillStyle = P.void;
          for (let i = 0; i < 6; i++) {
            const a = rot + (i / 6) * TAU + 0.5;
            ctx.beginPath();
            ctx.arc(CX + Math.cos(a) * 150, CY + Math.sin(a) * 150, 24 * solid, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }
        L.inkPath(ctx, body, { closed: true, width: 5, color: P.gold, smooth: false, seed: sd('body'), wobble: 0.5 });
        // the four rings, recoloured toward gold, stay as rim / web / hub edges
        [60, 120, 180].forEach((R, i) => {
          L.inkCircle(ctx, CX, CY, R, { width: 5 - i * 0.6, color: L.mix(ringCols[i], P.gold, solid), seed: sd('ring', i) });
        });
        // hub
        ctx.fillStyle = '#2B2110';
        ctx.beginPath();
        ctx.arc(CX, CY, 58, 0, TAU);
        ctx.fill();
        L.inkCircle(ctx, CX, CY, 58, { width: 4, color: P.gold, seed: sd('hub') });

        // 4 servo horn (a pill, rotated with the gear; vertical at the end)
        const hp = t < 1e-6 ? 0 : E.outBack(clamp(tw / 0.25));
        if (hp > 0) {
          ctx.save();
          ctx.translate(CX, CY);
          ctx.rotate(rot);
          ctx.translate(-CX, -CY);
          ctx.globalAlpha = 1;
          // the dim sits between the gear and the horn
          if (dim > 0) {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = L.rgba(P.screen, dim);
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            ctx.restore();
          }
          ctx.fillStyle = P.face;
          ctx.beginPath();
          L.pill(ctx, CX, CY, HORN_W * hp, HORN_H * hp);
          ctx.fill();
          // screw and arm holes fade before the horn becomes the eye
          const detail = (1 - E.inOutQuad(clamp((t - 0.58) / 0.22))) * hp;
          if (detail > 0.02) {
            ctx.fillStyle = L.rgba('#3A3A40', detail);
            ctx.beginPath();
            ctx.arc(CX, CY, 3.2, 0, TAU);
            ctx.fill();
            for (const dy of [-10, 10]) {
              ctx.beginPath();
              ctx.arc(CX, CY + dy, 1.4, 0, TAU);
              ctx.fill();
            }
          }
          ctx.restore();
        }
      });

      // spark on the downbeat as the teeth bite
      if (t < 0.3) L.glowDot(ctx, CX, CY, 16 * (1 - t / 0.3) + 4, { color: P.hot, intensity: 1 - t / 0.3, rays: 8, seed: sd('bite') });
    },
  });
})();

</script>
<script>
// ---- src\scenes\08-return.js
/*
 * Shot 8 'return' : T 8.0 - 8.5, paper.
 * Layers, back to front:
 *   1 paper sheet
 *   2 world under the eye camera (lib.eyeCam running 1 -> 0): desk, Stackchan, fading pencil circles
 *   3 screen-fixed speed lines, first half
 * Frame 0 = G6: the eye pill 260 x 520 at (640, 360) (servo horn). Last frame: rest framing (k = 0).
 */
(function () {
  'use strict';
  const ID = 'return';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const r = LIB.rng(sd('speed'));
    const speed = [];
    for (let i = 0; i < 40; i++) speed.push({ a: r.range(0, TAU), r0: r.range(300, 420), len: r.range(80, 240), w: r.range(0.8, 2) });
    GEO = { speed };
    return GEO;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const G = geo();
      const out = E.outQuart(clamp(t / (11 / 24)));
      const cam = L.eyeCam(1 - out);
      const [ex, ey] = L.SC.eyeR;

      L.paper(ctx, { color: P.sheet, vignette: 0.22, seed: 11, fibres: 0.6 });
      L.camera(ctx, cam, () => {
        L.inkLine(ctx, 150, L.SC.ground, 1130, L.SC.ground, { width: 1.5, color: P.pencil, alpha: 0.8, seed: LIB.hash('wake', 1) & 0x7fffffff, taper: [60, 90] });
        L.stackchan(ctx, { eyes: 'open', glow: 1, seed: 'stackchan' });
        const fade = 1 - clamp(t / 0.4);
        if (fade > 0) {
          [16, 24, 36, 52].forEach((R, i) => {
            L.guideCircle(ctx, ex, ey, R, { color: P.pencil, alpha: 0.75 * fade, width: 1.1 / Math.sqrt(cam.zoom) + 0.25, ink: true, seed: LIB.hash('smile', 'c', i) & 0x7fffffff });
          });
        }
      });

      const sp = 1 - clamp(t / 0.25);
      if (sp > 0) {
        const bi = L.boil(info.T);
        for (let i = 0; i < G.speed.length; i++) {
          const s = G.speed[i];
          if (L.h3(i, bi, 9) > 0.7) continue;
          L.inkLine(ctx, 640 + Math.cos(s.a) * s.r0, 360 + Math.sin(s.a) * s.r0, 640 + Math.cos(s.a) * (s.r0 + s.len), 360 + Math.sin(s.a) * (s.r0 + s.len), {
            width: s.w, color: P.lilac, alpha: 0.55 * sp, seed: sd('s', i, bi), taper: [30, 4],
          });
        }
      }
    },
  });
})();

</script>
<script>
// ---- src\scenes\09-coda.js
/*
 * Shot 9 'coda' : T 8.5 - 10.0, paper.
 * Layers, back to front:
 *   1 paper sheet
 *   2 desk, Stackchan
 *   3 servo motion ticks on the nods
 * Beats: 8.5 happy, 9.0 nod, 9.25 talks, 9.5 nod (happy), 9.75 dozes off.
 * Last frame = frame 0 of 'wake' (eyes closed, nod 0.5, roll 0.06, glow 0.25): the film loops.
 */
(function () {
  'use strict';
  const ID = 'coda';
  const LIB = FILM.lib;
  const FR = 1 / 24;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  const B_NOD1 = 0.5; // T 9.0
  const B_TALK = 0.75; // T 9.25
  const B_NOD2 = 1.0; // T 9.5
  const B_SLEEP = 1.25; // T 9.75

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const drawing = (a) => Math.floor((t - a) * 12 + 1e-6);
      const hit = (a, frames, e, lead = 1) => (t < a ? 0 : (e || ((u) => u))(clamp((t - a) / (frames * FR) + lead / frames)));
      const popTwos = (a) => (t < a ? 0 : [0.72, 1.08, 1][Math.min(2, drawing(a))]);
      const bump = (a, len) => (tw < a ? 0 : Math.sin(Math.PI * clamp((tw - a) / len)));

      L.paper(ctx, { color: P.sheet, vignette: 0.22, seed: 11, fibres: 0.6 });

      L.camera(ctx, { x: L.SC.cam0[0], y: L.SC.cam0[1], zoom: L.SC.zoom0 }, () => {
        L.inkLine(ctx, 150, L.SC.ground, 1130, L.SC.ground, { width: 1.5, color: P.pencil, alpha: 0.8, seed: LIB.hash('wake', 1) & 0x7fffffff, taper: [60, 90] });

        const sleep = hit(B_SLEEP, 4, E.inOutCubic);
        let eyes = 'happy', eyeScale = popTwos(0);
        if (t >= B_TALK && t < B_NOD2) { eyes = 'open'; eyeScale = popTwos(B_TALK); }
        if (t >= B_NOD2) { eyes = 'happy'; eyeScale = popTwos(B_NOD2); }
        if (t >= B_SLEEP) { eyes = 'closed'; eyeScale = 1; }
        const nod = 0.8 * bump(B_NOD1, 0.25) + 0.8 * bump(B_NOD2, 0.25);
        // talking mouth: open-close on the 16ths for one beat
        let mouth = 0.6 * (1 - hit(0, 5, E.outCubic));
        if (t >= B_TALK && t < B_NOD2) mouth = [0.9, 0.2, 0.7, 0.1][Math.min(3, Math.floor((t - B_TALK) / 0.0625))];
        L.stackchan(ctx, {
          eyes,
          eyeScale,
          mouth,
          nod: lerp(nod, 0.5, sleep),
          roll: 0.06 * sleep,
          glow: lerp(1, 0.25, sleep),
          seed: 'stackchan',
        });

        // servo ticks under the head on each nod
        for (const b of [B_NOD1, B_NOD2]) {
          const d = drawing(b);
          if (t < b || d > 2) continue;
          for (const s of [-1, 1]) {
            L.inkLine(ctx, 640 + s * 60, 510, 640 + s * (84 + d * 6), 518 + d * 4, { width: 2, alpha: 0.8 - d * 0.25, seed: sd(b, s, d), taper: 2 });
          }
        }
      });
    },
  });
})();
